<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 50px 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .section {
      margin-bottom: 35px;
    }

    .section h2 {
      font-size: 1.3rem;
      color: #4f46e5;
      margin-bottom: 12px;
      border-bottom: 2px solid #e0e7ff;
      padding-bottom: 6px;
    }

    .section p {
      font-size: 1.05rem;
      color: #555;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: #f3f4f6;
      color: #4f46e5;
    }

    .btn.secondary:hover {
      background: #e5e7eb;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
    }

    @media (max-width: 600px) {
      .header {
        padding: 40px 25px;
      }
      .content {
        padding: 30px 25px;
      }
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部介紹 -->
    <div class="header">
      <h1>你好，我是小明</h1>
      <p>喜歡學習新事物・探索科技・分享生活</p>
    </div>

    <div class="content">
      <!-- 關於我 -->
      <div class="section">
        <h2>關於我</h2>
        <p>
          我係一個對科技同創作有興趣嘅人。最近開始學習用 GitHub Pages 整自己嘅網站，希望透過呢個平台記錄學習過程同分享一啲有趣嘅發現。
        </p>
      </div>

      <!-- 興趣 -->
      <div class="section">
        <h2>興趣同專長</h2>
        <p>
          閱讀、旅行、學新工具、整理筆記、嘗試各種線上工具。目前正努力學習數碼技能，希望持續進步。
        </p>
      </div>

      <!-- 按鈕區 -->
      <div class="section">
        <h2>聯絡同連結</h2>
        <div class="buttons">
          <a href="mailto:your.email@example.com" class="btn">電郵聯絡</a>
          <a href="https://github.com/你的用戶名" class="btn secondary" target="_blank">我的 GitHub</a>
          <!-- 你可以再加多啲按鈕，例如： -->
          <!-- <a href="https://instagram.com/你的帳號" class="btn secondary" target="_blank">Instagram</a> -->
        </div>
      </div>
    </div>

    <div class="footer">
      © 2026 用 GitHub Pages 製作
    </div>
  </div>
</body>
</html>
